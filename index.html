<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>dept 705 - Engineering Breakdown Log</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Link to your external stylesheet -->
  <link rel="stylesheet" href="style.css">
  <style>
    /* Additional inline styles for collapsing the log table */
    .hidden-row {
      display: none;
    }
    .toggle-btn {
      background-color: #00aaff;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>dept 705 - Engineering Breakdown Log</h1>
    <p>Record machine breakdowns digitally for real‑time monitoring</p>
  </header>

  <!-- Breakdown Entry Form -->
  <section class="entry-form">
    <h2>Enter Breakdown Details</h2>
    <form id="breakdownForm">
      <label for="date">Date of Breakdown:</label>
      <input type="date" id="date" name="date">

      <label for="technician">Technician Name:</label>
      <input type="text" id="technician" name="technician" placeholder="e.g., John Doe">

      <label for="machine">Machine Name:</label>
      <input type="text" id="machine" name="machine" placeholder="e.g., CNC-3000">

      <label for="factory">Factory Location:</label>
      <select id="factory" name="factory">
        <option value="">--Select Factory--</option>
        <option value="Sandak">Sandak</option>
        <option value="Tannery">Tannery</option>
        <option value="Leather">Leather</option>
        <option value="DIP/canvas">DIP/canvas</option>
        <option value="Thongs">Thongs</option>
        <option value="Paletizing">Paletizing</option>
        <option value="Kingsteel">Kingsteel</option>
      </select>

      <label for="startTime">Start Time:</label>
      <!-- Use input type="time" for exact time selection (seconds are allowed) -->
      <input type="time" id="startTime" name="startTime" step="1">

      <label for="endTime">End Time:</label>
      <input type="time" id="endTime" name="endTime" step="1">

      <label for="reason">Reason for Breakdown:</label>
      <input type="text" id="reason" name="reason" placeholder="e.g., Overheating">

      <button type="submit">Add Breakdown</button>
    </form>
    <p style="font-size:0.9em;">* At least 4 fields must be filled in to submit a breakdown entry.</p>
  </section>

  <!-- Search and Filter Section -->
  <section class="search-section">
    <h2>Search Breakdowns</h2>
    <input type="text" id="searchBar" placeholder="Search by date, machine, technician, etc.">
    <div class="factory-filter">
      <label for="factoryFilter">Filter by Factory:</label>
      <select id="factoryFilter">
        <option value="">All Factories</option>
        <option value="Sandak">Sandak</option>
        <option value="Tannery">Tannery</option>
        <option value="Leather">Leather</option>
        <option value="DIP/canvas">DIP/canvas</option>
        <option value="Thongs">Thongs</option>
        <option value="Paletizing">Paletizing</option>
        <option value="Kingsteel">Kingsteel</option>
      </select>
    </div>
  </section>

  <!-- Breakdown Log Table -->
  <section class="log-table">
    <h2>Breakdown Log</h2>
    <table id="logTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Technician</th>
          <th>Machine</th>
          <th>Factory</th>
          <th>Start Time</th>
          <th>End Time</th>
          <th>Reason</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <!-- Entries will be inserted here by the script -->
      </tbody>
    </table>
    <div id="toggleIndexContainer"></div>
  </section>

  <!-- Firebase and Application Scripts -->
  <script type="module">
    // Import Firebase modules from the CDN.
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    // Replace with your Firebase configuration.
    const firebaseConfig = {
      apiKey: "AIzaSyC11Fdf67z47Ox64_RqQ1vwgwdQRZf2dvI",
      authDomain: "dept705.firebaseapp.com",
      projectId: "dept705",
      storageBucket: "dept705.firebasestorage.app",
      messagingSenderId: "333873965527",
      appId: "1:333873965527:web:0efce8b2c56bf682cdc392"
    };

    // Initialize Firebase and Firestore.
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const logsCollection = collection(db, "breakdownLogs");

    // Render breakdown logs in the table with real-time updates,
    // but collapse older entries (show only newest 3 by default).
    function renderLogs() {
      const searchQuery = document.getElementById('searchBar').value.toLowerCase();
      const factoryFilter = document.getElementById('factoryFilter').value;
      const tbody = document.querySelector('#logTable tbody');

      const q = query(logsCollection, orderBy("timestamp", "desc"));
      onSnapshot(q, (snapshot) => {
        let rows = [];
        snapshot.forEach((docSnap) => {
          const log = docSnap.data();
          log.id = docSnap.id;
          const logString = `${log.date} ${log.technician} ${log.machine} ${log.factory} ${log.startTime} ${log.endTime} ${log.reason}`.toLowerCase();
          if (logString.indexOf(searchQuery) === -1) return;
          if (factoryFilter && log.factory !== factoryFilter) return;
          rows.push(`<tr>
                      <td>${log.date}</td>
                      <td>${log.technician}</td>
                      <td>${log.machine}</td>
                      <td>${log.factory}</td>
                      <td>${log.startTime}</td>
                      <td>${log.endTime}</td>
                      <td>${log.reason}</td>
                      <td><button class="delete-btn" data-id="${log.id}">Delete</button></td>
                     </tr>`);
        });

        // Show only the newest 3 entries by default.
        const visibleRows = rows.slice(0, 3);
        const hiddenRows = rows.slice(3);
        tbody.innerHTML = visibleRows.join("");

        // Create or clear the toggle button.
        const toggleContainer = document.getElementById("toggleIndexContainer");
        toggleContainer.innerHTML = "";
        if (hiddenRows.length > 0) {
          const btn = document.createElement("button");
          btn.textContent = "Show more";
          btn.classList.add("toggle-btn");
          btn.addEventListener("click", () => {
            if (btn.textContent === "Show more") {
              tbody.innerHTML = rows.join("");
              btn.textContent = "Show less";
            } else {
              tbody.innerHTML = visibleRows.join("");
              btn.textContent = "Show more";
            }
          });
          toggleContainer.appendChild(btn);
        }
      });
    }
    renderLogs();

    // Handle breakdown entry form submission.
    document.getElementById('breakdownForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const date = document.getElementById('date').value.trim();
      const technician = document.getElementById('technician').value.trim();
      const machine = document.getElementById('machine').value.trim();
      const factory = document.getElementById('factory').value.trim();
      const startTime = document.getElementById('startTime').value;
      const endTime = document.getElementById('endTime').value;
      const reason = document.getElementById('reason').value.trim();

      // Require at least 4 fields.
      const filledCount = [date, technician, machine, factory, startTime, endTime, reason].filter(val => val !== "").length;
      if (filledCount < 4) {
        alert("Please fill in at least 4 fields to submit a breakdown entry.");
        return;
      }

      try {
        await addDoc(logsCollection, {
          date,
          technician,
          machine,
          factory,
          startTime,
          endTime,
          reason,
          timestamp: Date.now() // You could also use serverTimestamp() if preferred.
        });
        document.getElementById("breakdownForm").reset();
      } catch (error) {
        console.error("Error adding document: ", error);
      }
    });

    // Handle deletion of a breakdown entry.
    document.querySelector("#logTable tbody").addEventListener("click", async (e) => {
      if (e.target.classList.contains("delete-btn")) {
        const id = e.target.getAttribute("data-id");
        try {
          await deleteDoc(doc(db, "breakdownLogs", id));
        } catch (error) {
          console.error("Error deleting document: ", error);
        }
      }
    });

    // Update the log table when search text or factory filter changes.
    document.getElementById("searchBar").addEventListener("input", renderLogs);
    document.getElementById("factoryFilter").addEventListener("change", renderLogs);
  </script>
</body>
</html>
